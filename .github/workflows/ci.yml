name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Naive fails to compile, Fixed passes
        run: scripts/verify.sh
      - name: Build the demo app
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project Demo/Demo.xcodeproj -scheme Demo -destination "id=$udid" build
